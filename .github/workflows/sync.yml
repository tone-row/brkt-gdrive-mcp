name: Sync Google Drive

# NOTE: Scheduling moved into the sync server itself (sync-server/src/server.ts,
# SYNC_INTERVAL_HOURS) because GitHub silently disables scheduled workflows
# after 60 days of repo inactivity — which stopped all indexing May 17 -
# June 12, 2026. This workflow remains as a manual fallback trigger only.
on:
  workflow_dispatch: # Allow manual triggering

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # Server responds immediately, sync runs in background

    steps:
      - name: Trigger sync via Fly.io
        env:
          # SYNC_SERVER_URL should be set to the Fly.io sync server URL
          # e.g., https://brkt-gdrive-sync.fly.dev
          SYNC_SERVER_URL: ${{ secrets.SYNC_SERVER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Triggering sync at $(date -u)"

          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${SYNC_SERVER_URL}/sync" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 30)

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response: $body"
          echo "HTTP Status: $http_code"

          if [ "$http_code" -ne 200 ]; then
            echo "Failed to trigger sync (status $http_code)"
            exit 1
          fi

          echo "Sync triggered successfully (running in background on server)"
