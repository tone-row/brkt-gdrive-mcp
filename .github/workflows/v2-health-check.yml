name: V2 health check

# Weekly internal-consistency check of the V2 tables (the only write target
# since Aug 2026): documents stuck on placeholder timestamps, fully-indexed
# documents with zero vectors, orphan vectors. Fails the job on any drift.
#
# NOTE: GitHub silently disables scheduled workflows after 60 days without
# repo activity (this killed the old sync cron in May 2026). This check is a
# secondary guardrail — sync failures surface as failed file_jobs and failed
# user_sync_state rows first.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  v2-health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: V2 health check (fails on drift)
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: bun scripts/check-v2-health.ts --check
