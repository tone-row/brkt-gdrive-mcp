name: V1/V2 reconcile drift check

# Guardrail for the silent dual-write failure mode: sync writes V1 first and
# swallows V2 errors, and a failed V2 write is not retried until the doc's
# next Drive edit — while search is SERVED from V2. This dry-run reconcile
# fails the job on any drift so it gets noticed and healed with --apply.
#
# NOTE: GitHub silently disables scheduled workflows after 60 days without
# repo activity (this killed the old sync cron in May 2026). This check is a
# secondary guardrail — per-sync V2 write-error counts in the sync-server
# logs/results are the primary signal.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  reconcile-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Reconcile dry run (fails on drift)
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: bun scripts/reconcile-v2.ts --check
